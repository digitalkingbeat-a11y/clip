    <script>
      (function() {
        function isExtensionError(msg, source, stack) {
          var str = ((msg || '') + ' ' + (source || '') + ' ' + (stack || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-extension://') !== -1 ||
            str.indexOf('failed to connect to metamask') !== -1 ||
            str.indexOf('ethereum') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename, event.error && event.error.stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          var stack = (reason && reason.stack) || '';
          if (isExtensionError(msg, '', stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
